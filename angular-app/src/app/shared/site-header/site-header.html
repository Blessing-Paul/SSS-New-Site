<header class="site-header" id="top" #header>
  <div class="site-container nav-wrap">
    <a class="brand" href="/" aria-label="Stable Shield Solutions home">
      <img class="brand-logo" src="assets/stable-shield-logo-transparent.png" alt="Stable Shield Solutions Limited logo">
      <img class="brand-logo-light" src="assets/stable-shield-logo-light.png" alt="" aria-hidden="true">
    </a>
    <button class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen" aria-controls="primary-nav"
      [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'" (click)="toggleMenu()" #toggle>
      <span class="mt-bar"></span><span class="mt-bar"></span><span class="mt-bar"></span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="Main navigation" #navigation
      [class.is-open]="menuOpen" [attr.aria-hidden]="mobileBreakpoint.matches && !menuOpen">
      <button class="nav-close" type="button" aria-label="Close navigation" (click)="closeMenu(true)" #closeButton><span aria-hidden="true">&times;</span></button>
      <a href="/" [attr.aria-current]="isCurrent('/') ? 'page' : null" (click)="closeMenu()">Home</a>
      <a href="/about" [attr.aria-current]="isCurrent('/about') ? 'page' : null" (click)="closeMenu()">About</a>
      <a href="/services" [attr.aria-current]="isCurrent('/services') ? 'page' : null" (click)="closeMenu()">Services</a>
      <a href="/products" [attr.aria-current]="isCurrent('/products') ? 'page' : null" (click)="closeMenu()">Products</a>
      <a href="/industries" [attr.aria-current]="isCurrent('/industries') ? 'page' : null" (click)="closeMenu()">Industries</a>
      <a href="/resources" [attr.aria-current]="isCurrent('/resources') ? 'page' : null" (click)="closeMenu()">Resources</a>
      <a href="/partners" [attr.aria-current]="isCurrent('/partners') ? 'page' : null" (click)="closeMenu()">Partners</a>
      <a href="/careers" [attr.aria-current]="isCurrent('/careers') ? 'page' : null" (click)="closeMenu()">Careers</a>
      <a class="nav-mobile-only" href="/login" (click)="closeMenu()"><i class="bi bi-person-lock" aria-hidden="true"></i> Staff login</a>
      <a class="nav-cta" href="/contact" (click)="closeMenu()">Contact us <span aria-hidden="true">↗</span></a>
    </nav>
    <button class="theme-toggle" type="button" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="darkMode" (click)="toggleTheme()">
      <i class="bi bi-moon-stars" aria-hidden="true"></i><i class="bi bi-sun" aria-hidden="true"></i>
    </button>
  </div>
</header>
<button class="mobile-nav-backdrop" type="button" aria-label="Close navigation"
  [class.is-visible]="menuOpen" (click)="closeMenu(true)" #backdrop></button>
