<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stable Shield Solutions | Technology That Moves You Forward</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#133255">
  <link rel="icon" type="image/png" href="assets/stable-shield-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=League+Spartan:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    (() => {
      const saved = localStorage.getItem('theme');
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <form name="project-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="project-enquiry">
    <input name="bot-field"><input name="name"><input name="email"><input name="organization">
    <input name="phone"><input name="interest"><input name="industry"><input name="service">
    <textarea name="message"></textarea><input name="consent">
  </form>
  <form name="meeting-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="meeting-request">
    <input name="bot-field"><input name="name"><input name="email"><input name="date">
    <input name="time"><input name="type"><input name="topic">
  </form>
  <form name="support-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="support-request">
    <input name="bot-field"><input name="name"><input name="organization"><input name="email">
    <input name="phone"><input name="system"><input name="priority"><textarea name="message"></textarea>
  </form>
  <form name="product-demo" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="product-demo">
    <input name="bot-field"><input name="name"><input name="organization"><input name="email">
    <input name="phone"><input name="product"><input name="users"><textarea name="message"></textarea>
    <input name="consent">
  </form>
  <form name="career-application" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
    <input type="hidden" name="form-name" value="career-application">
    <input name="bot-field"><input name="name"><input name="email"><input name="phone">
    <input name="portfolio"><input name="role"><input name="cv"><textarea name="message"></textarea>
    <input name="consent">
  </form>
  <form name="partner-application" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="partner-application">
    <input name="bot-field"><input name="partnership_type"><input name="products">
    <input name="organization"><input name="registration_number"><input name="organization_type">
    <input name="team_size"><input name="website"><input name="years_operating"><input name="country">
    <input name="city"><input name="address"><input name="contact_name"><input name="contact_title">
    <input name="contact_email"><input name="contact_phone"><input name="contact_method">
    <input name="capabilities"><input name="regions"><input name="sectors"><input name="project_description">
    <input name="project_stage"><input name="project_stack"><input name="project_support">
    <input name="timeline"><input name="budget"><input name="goals"><input name="source"><input name="consent">
  </form>
  <app-root></app-root>
</body>
</html>
